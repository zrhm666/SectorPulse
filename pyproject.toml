[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sector-pulse"
version = "0.1.0"
description = "Evidence-first A-share sector analysis assistant"
requires-python = ">=3.12"
dependencies = ["akshare>=1.17,<2", "fastapi>=0.115,<1", "httpx>=0.28,<1", "pandas>=2.2,<4", "pydantic>=2.11,<3", "PyYAML>=6,<7", "typer>=0.16,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["mypy>=1.17,<2", "pandas-stubs>=2.2,<3", "pytest>=8.4,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "types-PyYAML>=6,<7"]

[project.scripts]
sector-pulse = "sector_pulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/sector_pulse"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"
markers = ["live: requires explicit live network access", "live_llm: requires explicit live LLM access"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sector_pulse"]
mypy_path = "backend/src"
